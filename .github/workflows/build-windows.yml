# Builds the Windows app (a zip with Project Terra.exe) on demand, for Morgan to test on the laptop.
# Run it from Actions > Build Windows app > Run workflow. Not run on PRs: it costs a few minutes each time.
name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-terra-windows-${{ github.sha }}
          path: release/*.zip
          retention-days: 14
          compression-level: 0
